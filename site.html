<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>EBWRAPPING</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --brand-red: #dc2626;
  --brand-red-dark: #b91c1c;
  --page-bg: #000;
  --card-bg: #111;
  --text: #fff;
  --muted: #d1d5db;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--page-bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

section {
  padding: 56px 20px;
  text-align: center;
}

/* =========================
   HERO
========================= */

.hero {
  padding-top: 72px;
  padding-bottom: 36px;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 14px;
  font-size: clamp(40px, 9vw, 88px);
}

h2 {
  margin-bottom: 12px;
  font-size: clamp(28px, 5vw, 44px);
}

.hero p {
  margin-bottom: 30px;
  color: var(--muted);
  font-size: clamp(18px, 3vw, 26px);
  line-height: 1.6;
}

.btn {
  display: inline-block;
  padding: 18px 42px;
  background: var(--brand-red);
  color: white;
  text-decoration: none;
  font-size: 22px;
  border-radius: 14px;
  font-weight: bold;
  transition: .2s ease;
}

.btn:hover {
  background: var(--brand-red-dark);
  transform: translateY(-2px);
}


/* =========================
   INVENTORY
========================= */

.inventory {
  padding-top: 50px;
  padding-bottom: 80px;
}

.inventory-description {
  color: #9ca3af;
  font-size: 17px;
  margin-bottom: 38px;
}

.inventory-grid {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 22px;
}


/* PRODUCT CARD */

.product-card {
  position: relative;
  overflow: hidden;

  background: var(--card-bg);
  border: 1px solid #242424;
  border-radius: 18px;

  text-align: right;

  transition:
    transform .25s ease,
    border-color .25s ease;
}

.product-card:hover {
  transform: translateY(-5px);
  border-color: var(--brand-red);
}


/* IMAGE */

.product-image {
  width: 100%;
  height: 230px;
  object-fit: cover;
  display: block;
  background: #181818;
}


/* INFO */

.product-info {
  padding: 18px;
}

.product-info h3 {
  margin: 0 0 18px;
  font-size: 22px;
  color: white;
}


/* STATUS */

.stock {
  position: absolute;
  top: 12px;
  right: 12px;

  padding: 7px 12px;
  border-radius: 20px;

  font-size: 13px;
  font-weight: bold;

  z-index: 2;
}

.stock.available {
  background: #16a34a;
}

.stock.low {
  background: #d97706;
}

.stock.out {
  background: #525252;
}


/* ORDER BUTTON */

.product-btn {
  display: block;
  width: 100%;

  padding: 13px 10px;

  border-radius: 10px;

  background: var(--brand-red);

  color: white;

  text-align: center;
  text-decoration: none;

  font-size: 16px;
  font-weight: bold;

  transition: background .2s ease;
}

.product-btn:hover {
  background: var(--brand-red-dark);
}


/* SOLD OUT */

.product-card.sold-out .product-image {
  opacity: .4;
}

.product-card.sold-out .product-btn {
  background: #333;
  color: #777;
  pointer-events: none;
}


/* LOADING */

.loading {
  grid-column: 1 / -1;
  padding: 50px 20px;
  color: #9ca3af;
  font-size: 18px;
}

.error-message {
  grid-column: 1 / -1;
  padding: 30px;
  color: #f87171;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  section {
    padding: 42px 14px;
  }

  .hero {
    padding-top: 54px;
  }

  .btn {
    width: min(88vw, 360px);
    padding: 16px 20px;
    font-size: 20px;
  }

  .inventory {
    padding-top: 45px;
  }

  .inventory-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .product-image {
    height: 170px;
  }

  .product-info {
    padding: 13px;
  }

  .product-info h3 {
    font-size: 17px;
  }

  .product-btn {
    font-size: 14px;
    padding: 11px 6px;
  }

  .stock {
    top: 8px;
    right: 8px;

    font-size: 11px;
    padding: 5px 8px;
  }
}

</style>
</head>


<body>


<!-- HERO -->

<section class="hero">

  <h1>EBWRAPPING</h1>

  <p>
    עטיפות רכב • השחרת חלונות • PPF
  </p>

  <a
    class="btn"
    href="https://wa.me/972504469777"
    target="_blank"
    rel="noopener"
  >
    קביעת תור
  </a>

</section>


<!-- INVENTORY -->

<section class="inventory">

  <h2>המלאי שלנו</h2>

  <p class="inventory-description">
    בחרו את הצבע והסגנון שמתאים לרכב שלכם
  </p>

  <div
    class="inventory-grid"
    id="inventoryGrid"
  >

    <div class="loading">
      טוען מלאי...
    </div>

  </div>

</section>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  'https://gdcfgslzqkxmeasslfcq.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_Ek1TmaDECTedjTDmdMUJPA_trWZXBLI';


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   LOAD INVENTORY
===================================== */

async function loadInventory() {

  const grid =
    document.getElementById('inventoryGrid');


  const { data, error } =
    await supabaseClient
      .from('products')
      .select('*')
      .order('id', {
        ascending: true
      });


  /* ERROR */

  if (error) {

    console.error(error);

    grid.innerHTML = `
      <div class="error-message">
        לא ניתן לטעון את המלאי כרגע
      </div>
    `;

    return;
  }


  /* EMPTY */

  if (!data || data.length === 0) {

    grid.innerHTML = `
      <div class="loading">
        אין מוצרים במלאי כרגע
      </div>
    `;

    return;
  }


  /* PRODUCTS */

  grid.innerHTML =
    data.map(product => {

      const name =
        product['שם'] || 'מוצר';

      const image =
        product['תמונה'] || '';

      const status =
        product['זמינות'] || 'אזל מהמלאי';


      let statusClass = 'out';

      if (status === 'במלאי') {
        statusClass = 'available';
      }

      else if (status === 'נשאר מעט') {
        statusClass = 'low';
      }


      const soldOut =
        status === 'אזל מהמלאי';


      const whatsappText =
        encodeURIComponent(
          `שלום, אני מעוניין במוצר ${name}`
        );


      return `

        <article
          class="product-card
          ${soldOut ? 'sold-out' : ''}"
        >

          <span
            class="stock ${statusClass}"
          >
            ${escapeHtml(status)}
          </span>


          ${
            image
            ?
            `
            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
              loading="lazy"
            >
            `
            :
            `
            <div
              class="product-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                color:#666;
              "
            >
              אין תמונה
            </div>
            `
          }


          <div class="product-info">

            <h3>
              ${escapeHtml(name)}
            </h3>


            ${
              soldOut

              ?

              `
              <a class="product-btn">
                לא זמין כרגע
              </a>
              `

              :

              `
              <a
                class="product-btn"
                href="https://wa.me/972504469777?text=${whatsappText}"
                target="_blank"
                rel="noopener"
              >
                לפרטים והזמנה
              </a>
              `
            }

          </div>

        </article>

      `;

    }).join('');

}


/* =====================================
   SECURITY
===================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}


/* START */

loadInventory();

</script>


</body>
</html>
