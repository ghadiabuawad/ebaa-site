<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>EBWRAPPING</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --brand-red: #dc2626;
  --brand-red-dark: #b91c1c;
  --page-bg: #000;
  --card-bg: #111;
  --text: #fff;
  --muted: #d1d5db;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--page-bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

section {
  padding: 56px 20px;
  text-align: center;
}

/* =========================
   HERO
========================= */

.hero {
  padding-top: 72px;
  padding-bottom: 36px;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 14px;
  font-size: clamp(40px, 9vw, 88px);
}

h2 {
  margin-bottom: 12px;
  font-size: clamp(28px, 5vw, 44px);
}

.hero p {
  margin-bottom: 30px;
  color: var(--muted);
  font-size: clamp(18px, 3vw, 26px);
  line-height: 1.6;
}

.btn {
  display: inline-block;
  padding: 18px 42px;
  background: var(--brand-red);
  color: white;
  text-decoration: none;
  font-size: 22px;
  border-radius: 14px;
  font-weight: bold;
  transition: .2s ease;
}

.btn:hover {
  background: var(--brand-red-dark);
  transform: translateY(-2px);
}


/* =========================
   INVENTORY
========================= */

.inventory {
  padding-top: 50px;
  padding-bottom: 80px;
}

.inventory-description {
  color: #9ca3af;
  font-size: 17px;
  margin-bottom: 38px;
}

/* Grid */

.inventory-grid {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 22px;
}


/* Product card */

.product-card {
  position: relative;
  overflow: hidden;

  background: var(--card-bg);
  border: 1px solid #242424;
  border-radius: 18px;

  text-align: right;

  transition:
    transform .25s ease,
    border-color .25s ease;
}

.product-card:hover {
  transform: translateY(-5px);
  border-color: var(--brand-red);
}


/* Product image */

.product-image {
  width: 100%;
  height: 230px;

  object-fit: cover;
  display: block;
}


/* Information */

.product-info {
  padding: 18px;
}

.product-info h3 {
  margin: 0 0 5px;

  font-size: 22px;
  color: white;
}

.product-type {
  margin-bottom: 18px;

  color: #9ca3af;
  font-size: 14px;
}


/* Stock status */

.stock {
  position: absolute;

  top: 12px;
  right: 12px;

  padding: 7px 12px;

  border-radius: 20px;

  font-size: 13px;
  font-weight: bold;

  z-index: 2;
}

.stock.available {
  background: #16a34a;
}

.stock.low {
  background: #d97706;
}

.stock.out {
  background: #525252;
}


/* Order button */

.product-btn {
  display: block;

  width: 100%;

  padding: 13px 10px;

  border-radius: 10px;

  background: var(--brand-red);

  color: white;

  text-align: center;
  text-decoration: none;

  font-size: 16px;
  font-weight: bold;

  transition: background .2s ease;
}

.product-btn:hover {
  background: var(--brand-red-dark);
}


/* Out of stock */

.product-card.sold-out .product-image {
  opacity: .4;
}

.product-card.sold-out .product-btn {
  background: #333;
  color: #777;

  pointer-events: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  section {
    padding: 42px 14px;
  }

  .hero {
    padding-top: 54px;
  }

  .btn {
    width: min(88vw, 360px);

    padding: 16px 20px;

    font-size: 20px;
  }

  .inventory {
    padding-top: 45px;
  }

  .inventory-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .product-image {
    height: 170px;
  }

  .product-info {
    padding: 13px;
  }

  .product-info h3 {
    font-size: 17px;
  }

  .product-type {
    font-size: 12px;
  }

  .product-btn {
    font-size: 14px;
    padding: 11px 6px;
  }

  .stock {
    top: 8px;
    right: 8px;

    font-size: 11px;
    padding: 5px 8px;
  }
}

</style>
</head>


<body>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <h1>EBWRAPPING</h1>

  <p>
    עטיפות רכב • השחרת חלונות • PPF
  </p>

  <a
    class="btn"
    href="https://wa.me/972504469777"
    target="_blank"
    rel="noopener"
  >
    קביעת תור
  </a>

</section>



<!-- =========================
     INVENTORY
========================= -->

<section class="inventory">

  <h2>המלאי שלנו</h2>

  <p class="inventory-description">
    בחרו את הצבע והסגנון שמתאים לרכב שלכם
  </p>


  <div class="inventory-grid">


    <!-- PRODUCT 1 -->

    <article class="product-card">

      <span class="stock available">
        במלאי
      </span>

      <img
        class="product-image"
        src="black-gloss.jpg"
        alt="שחור מבריק"
      >

      <div class="product-info">

        <h3>שחור מבריק</h3>

        <p class="product-type">
          Gloss Black
        </p>

        <a
          class="product-btn"
          href="https://wa.me/972504469777?text=שלום,%20אני%20מעוניין%20בשחור%20מבריק"
          target="_blank"
        >
          לפרטים והזמנה
        </a>

      </div>

    </article>



    <!-- PRODUCT 2 -->

    <article class="product-card">

      <span class="stock available">
        במלאי
      </span>

      <img
        class="product-image"
        src="matte-black.jpg"
        alt="שחור מט"
      >

      <div class="product-info">

        <h3>שחור מט</h3>

        <p class="product-type">
          Matte Black
        </p>

        <a
          class="product-btn"
          href="https://wa.me/972504469777?text=שלום,%20אני%20מעוניין%20בשחור%20מט"
          target="_blank"
        >
          לפרטים והזמנה
        </a>

      </div>

    </article>



    <!-- PRODUCT 3 -->

    <article class="product-card">

      <span class="stock low">
        נשאר מעט
      </span>

      <img
        class="product-image"
        src="carbon.jpg"
        alt="קרבון"
      >

      <div class="product-info">

        <h3>קרבון</h3>

        <p class="product-type">
          Carbon Fiber
        </p>

        <a
          class="product-btn"
          href="https://wa.me/972504469777?text=שלום,%20אני%20מעוניין%20בקרבון"
          target="_blank"
        >
          לפרטים והזמנה
        </a>

      </div>

    </article>



    <!-- PRODUCT 4 -->

    <article class="product-card sold-out">

      <span class="stock out">
        אזל מהמלאי
      </span>

      <img
        class="product-image"
        src="nardo-grey.jpg"
        alt="אפור נרדו"
      >

      <div class="product-info">

        <h3>אפור נרדו</h3>

        <p class="product-type">
          Nardo Grey
        </p>

        <a class="product-btn">
          לא זמין כרגע
        </a>

      </div>

    </article>


  </div>

</section>


</body>
</html>
